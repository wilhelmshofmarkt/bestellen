<!DOCTYPE html>
<html lang="de">
<head>
  <link rel="icon" type="image/svg+xml" href="images-2.svg">
<link rel="icon" href="images-2.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hofmarkt Bestellplan</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap');
:root{--bg:#F5F0E8;--card:#FFFDF8;--text:#1A1208;--muted:#8A7E6A;--danger:#C0392B;--success:#2D5016;--warn:#D4830A;--border:rgba(0,0,0,.09);--input-bg:#fff;--input-border:#d4c9b8;--chip-bg:#e8e0d0;--chip-active-bg:#2D5016;--summary-bg:#f0ece4;--hist-body:#fafaf7;--modal-bg:#fff}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#1e1c19;
    --card:#2a2723;
    --text:#e8e0d0;
    --muted:#8a8278;
    --danger:#e05545;
    --success:#5a9e3a;
    --warn:#d4830A;
    --border:rgba(255,255,255,.08);
    --input-bg:#333028;
    --input-border:#4a4540;
    --chip-bg:#333028;
    --chip-active-bg:#3a6b1e;
    --summary-bg:#252320;
    --hist-body:#252320;
    --modal-bg:#2a2723;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{overflow-x:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px}
#loading{position:fixed;inset:0;background:var(--bg);z-index:9000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}

header{background:#2D5016;color:white;padding:14px 14px 10px;position:relative;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.2)}
header h1{font-family:'DM Serif Display',serif;font-size:1.3rem}
.header-row2{display:flex;gap:8px;margin-top:9px;align-items:center}
.search-bar{flex:1;position:relative}
.search-bar input{width:100%;padding:8px 12px 8px 31px;border-radius:8px;border:none;background:rgba(255,255,255,.18);color:white;font-size:.88rem;font-family:'DM Sans',sans-serif;outline:none}
.search-bar input::placeholder{color:rgba(255,255,255,.5)}
.search-bar::before{content:"🔍";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.8rem}
.btn-primary{background:var(--warn);color:white;border:none;border-radius:8px;padding:8px 13px;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 #9c5e06;transition:all .1s}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #9c5e06}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.btn-primary.edit-mode{background:#1A6BA0;box-shadow:0 3px 0 #0f4d78}
.btn-primary.edit-mode:active{box-shadow:0 1px 0 #0f4d78}
#status-bar{background:none;padding:2px 13px;font-size:.68rem;color:rgba(255,255,255,.75);text-align:right}

/* EDIT MODE BANNER */
#edit-mode-banner{display:none;background:#1A6BA0;color:white;padding:8px 14px;font-size:.8rem;font-weight:600;align-items:center;justify-content:space-between;gap:8px}
#edit-mode-banner.visible{display:flex}
.btn-cancel-edit{background:rgba(255,255,255,.2);color:white;border:1.5px solid rgba(255,255,255,.4);border-radius:7px;padding:4px 10px;font-family:'DM Sans',sans-serif;font-size:.77rem;cursor:pointer}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.hidden{display:none}
.modal-sheet{background:var(--card);border-radius:20px 20px 0 0;padding:22px 18px 34px;width:100%;max-width:480px;box-shadow:0 -4px 30px rgba(0,0,0,.18)}
.modal-sheet h2{font-family:'DM Serif Display',serif;font-size:1.15rem;margin-bottom:5px;color:var(--text)}
.modal-sheet p{font-size:.82rem;color:var(--muted);margin-bottom:16px}
.day-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.day-btn{padding:10px 4px;border:2px solid #ddd;border-radius:11px;background:white;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;transition:all .15s;line-height:1.3}
.day-btn:hover{border-color:#2D5016;color:#2D5016}
.day-btn.selected{background:#2D5016;border-color:#2D5016;color:white}
.modal-actions{display:flex;gap:9px}
.btn-modal-ok{flex:1;background:#2D5016;color:white;border:none;border-radius:10px;padding:12px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer}
.btn-modal-ok:disabled{opacity:.45;cursor:not-allowed}
.btn-modal-cancel{background:transparent;color:var(--muted);border:1.5px solid #ddd;border-radius:10px;padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:.88rem;cursor:pointer}

/* TABS */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e8e2d8;position:relative;z-index:150;overflow:hidden}
.tab-btn{flex:1;min-width:0;padding:10px 3px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:.68rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:0;transition:all .15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-btn.active{color:#2D5016;border-bottom-color:#2D5016}
.tab-panel{display:none;padding:10px}
.tab-panel.active{display:block}

/* CATEGORIES */
.category{margin-bottom:12px;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 1px 6px rgba(0,0,0,.06)}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.cat-header-left{display:flex;align-items:center;gap:8px}
.cat-icon{font-size:1.2rem}.cat-name{font-weight:600;font-size:.91rem}
.cat-count{font-size:.7rem;background:rgba(255,255,255,.25);padding:2px 7px;border-radius:20px;font-weight:500}
.chevron{font-size:.65rem;opacity:.6;transition:transform .2s}
.category.open .chevron{transform:rotate(180deg)}
.cat-items{display:none;border-top:1px solid rgba(0,0,0,.06)}
.category.open .cat-items{display:block}

/* COL HEADERS */
.col-headers{display:flex;align-items:center;padding:4px 12px 3px;background:rgba(0,0,0,.03);border-bottom:1px solid rgba(0,0,0,.05);gap:6px}
.col-headers span{font-size:.65rem;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ch-plu{min-width:30px}.ch-name{flex:1}
.ch-bestand,.ch-bestellen{width:62px;text-align:center;flex-shrink:0}
.ch-notiz{flex:1}.ch-actions{width:26px}

/* ITEMS */
.item{display:flex;flex-direction:column;padding:6px 12px;border-bottom:1px solid rgba(0,0,0,.04);gap:4px}
.item:last-child{border-bottom:none}.item.hidden{display:none}.category.all-hidden{display:none}
.item-main{display:flex;align-items:center;gap:5px}
.item-notiz-row{display:flex;padding-left:35px}
.plu-num{font-weight:700;font-size:.8rem;color:var(--muted);min-width:30px;text-align:right;flex-shrink:0}
.plu-name{font-size:.88rem;flex:1}

/* INFO-ONLY */
.item-info{display:flex;align-items:center;padding:5px 12px;border-bottom:1px solid rgba(0,0,0,.03);gap:5px}
.item-info:last-child{border-bottom:none}.item-info.hidden{display:none}
.item-info .plu-num{color:var(--muted);opacity:.7}
.item-info .plu-name{font-size:.86rem;color:var(--text)}
.info-tag{font-size:.59rem;background:#f0f0ea;color:var(--muted);border:1px solid #ddd;padding:1px 5px;border-radius:8px;flex-shrink:0}

.user-badge{font-size:.59rem;background:#e8f5e9;color:#2D5016;border:1px solid #a5d6a7;padding:1px 5px;border-radius:10px;font-weight:600;flex-shrink:0}
.qty-input{width:62px;flex-shrink:0;padding:5px 4px;border:1.5px solid rgba(0,0,0,.14);border-radius:7px;font-size:.85rem;font-family:'DM Sans',sans-serif;text-align:center;background:#fff;color:var(--text);outline:none;transition:border-color .15s,background .15s;-moz-appearance:textfield}
.qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none}
.qty-input:focus{border-color:#2D5016}
.qty-input.filled{background:#FFF8E7;border-color:var(--warn);color:#7A4F00;font-weight:700}
.qty-input.filled-bestand{background:#EEF8E6;border-color:#2D5016;color:#1a4008;font-weight:700}
.notiz-input{flex:1;padding:3px 7px;border:1.5px solid rgba(0,0,0,.1);border-radius:6px;font-size:.77rem;font-family:'DM Sans',sans-serif;background:rgba(0,0,0,.02);color:var(--text);outline:none}
.notiz-input::placeholder{color:rgba(0,0,0,.22);font-style:italic}
.notiz-input:focus{border-color:#2D5016;background:#fff}
.item-actions{width:26px;flex-shrink:0;display:flex;justify-content:flex-end}
.btn-del{background:none;border:none;color:#ccc;font-size:.88rem;cursor:pointer;padding:2px;transition:color .15s;line-height:1}
.btn-del:hover{color:var(--danger)}
.item-avg-hint{font-size:.71rem;color:var(--muted);padding:0 12px 4px 35px;font-style:italic}
.item-avg-hint span{background:#f5f0e8;border-radius:4px;padding:1px 5px;font-style:normal;font-weight:600;color:#7A5C2E}

/* ADD FORM */
.cat-footer{padding:6px 12px;border-top:1px dashed rgba(0,0,0,.1)}
.btn-add-product{width:100%;background:transparent;border:1.5px dashed rgba(0,0,0,.17);border-radius:8px;padding:6px 12px;font-size:.79rem;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;text-align:left}
.btn-add-product:hover{border-color:#2D5016;color:#2D5016}
.add-form{display:none;padding:10px 12px;background:#f0f7eb;border-top:1px solid #c8e6c9;gap:8px;flex-wrap:wrap;align-items:flex-end}
.add-form.open{display:flex}
.add-form label{font-size:.68rem;color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.add-form input{padding:6px 9px;border:1.5px solid #c8e6c9;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.84rem;background:white;outline:none}
.add-form input:focus{border-color:#2D5016}
.add-form-name{flex:1;min-width:110px}.add-form-plu{width:76px}
.btn-add-confirm{background:#2D5016;color:white;border:none;border-radius:8px;padding:7px 13px;font-family:'DM Sans',sans-serif;font-size:.81rem;font-weight:600;cursor:pointer}
.btn-add-cancel{background:transparent;color:var(--muted);border:1px solid #ccc;border-radius:8px;padding:7px 11px;font-family:'DM Sans',sans-serif;font-size:.81rem;cursor:pointer}

/* TAG-BANNER */
#day-banner{background:var(--card);border-radius:14px;margin-bottom:10px;padding:11px 13px;box-shadow:0 1px 6px rgba(0,0,0,.07);border:2px solid #ddd;transition:border-color .2s}
#day-banner.day-selected{border-color:#2D5016}
.day-banner-label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.day-banner-chips{display:flex;gap:6px;flex-wrap:wrap}
.day-select-chip{padding:6px 13px;border:2px solid #ddd;border-radius:20px;background:white;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.day-select-chip:hover{border-color:#2D5016;color:#2D5016}
.day-select-chip.active{background:#2D5016;border-color:#2D5016;color:white}
.day-banner-hint{font-size:.72rem;color:var(--warn);margin-top:7px}

/* ÜBERSICHT */
.uebersichten{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.summary-section{flex:1;min-width:250px;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.09)}
.bestell-section{border:2px solid var(--danger)}.gesamt-section{border:2px solid #2D5016}
.summary-header{color:white;padding:11px 14px;display:flex;align-items:center;justify-content:space-between}
.bestell-section .summary-header{background:var(--danger)}.gesamt-section .summary-header{background:#2D5016}
.summary-header h2{font-family:'DM Serif Display',serif;font-size:.98rem}
.sum-count{font-size:.73rem;background:rgba(255,255,255,.22);padding:2px 9px;border-radius:20px;font-weight:600}
.summary-empty{padding:15px 14px;text-align:center;color:var(--muted);font-size:.85rem}
.summary-cat{border-bottom:1px solid rgba(0,0,0,.06)}.summary-cat:last-child{border-bottom:none}
.summary-cat-label{padding:5px 13px 3px;font-weight:700;font-size:.74rem;color:white}
.summary-row{display:flex;align-items:center;flex-wrap:wrap;padding:4px 13px;gap:5px;border-bottom:1px solid rgba(0,0,0,.04)}
.summary-row:last-child{border-bottom:none}
.sum-plu{font-size:.74rem;color:var(--muted);font-weight:700;min-width:24px;text-align:right}
.sum-name{flex:1;font-size:.84rem;min-width:80px}
.sum-badge-order{background:var(--danger);color:white;font-size:.71rem;font-weight:700;padding:2px 7px;border-radius:20px}
.sum-badge-qty{background:#2D5016;color:white;font-size:.71rem;font-weight:700;padding:2px 7px;border-radius:20px}
.sum-notiz{font-size:.71rem;color:var(--muted);font-style:italic;width:100%;padding-left:29px}
.sum-arrow{font-size:.85rem;font-weight:700;flex-shrink:0;line-height:1}
.sum-arrow.up2{color:#1a7a1a}.sum-arrow.up1{color:#7a9e1a}.sum-arrow.even{color:#aaa}.sum-arrow.down1{color:#c87a00}.sum-arrow.down2{color:#b22222}
.sum-trend{font-size:.68rem;font-weight:700;padding:1px 5px;border-radius:8px;flex-shrink:0;white-space:nowrap}
.sum-trend.trend-up{background:#e6f4e6;color:#1a7a1a}.sum-trend.trend-down{background:#fdeaea;color:#b22222}.sum-trend.trend-flat{background:#f0f0ea;color:#888}
.sum-avg-note{font-size:.69rem;color:var(--muted);padding:3px 13px 5px;font-style:italic}
.btn-clear{display:block;margin:10px auto;padding:6px 17px;background:transparent;border:1.5px solid rgba(0,0,0,.16);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.79rem;color:var(--muted);cursor:pointer}
.btn-clear:hover{background:rgba(0,0,0,.05)}
.btn-print{background:#1A1208;color:white;border:none;border-radius:8px;padding:8px 14px;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;margin:10px 14px 4px;box-shadow:0 3px 0 #000;transition:all .1s}
.btn-print:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn-kiemle{background:#5B3A8E;color:white;border:none;border-radius:8px;padding:8px 14px;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;margin:6px 14px 4px;box-shadow:0 3px 0 #3a1f6e;transition:all .1s}
.btn-kiemle:active{transform:translateY(2px);box-shadow:0 1px 0 #3a1f6e}
.btn-bestellmenu{background:#2D5016;color:white;border:none;border-radius:10px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;margin:10px 14px 4px;box-shadow:0 3px 0 #1a3a0a;transition:all .1s;width:calc(100% - 28px)}
.btn-bestellmenu:active{transform:translateY(2px);box-shadow:0 1px 0 #1a3a0a}
.bestellmenu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:flex;align-items:flex-end;justify-content:center}
.bestellmenu-overlay.hidden{display:none}
.bestellmenu-sheet{background:var(--card, #fff);border-radius:22px 22px 0 0;padding:20px 0 32px;width:100%;max-width:520px;box-shadow:0 -4px 32px rgba(0,0,0,.18);max-height:92vh;overflow-y:auto}
.bestellmenu-handle{width:38px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:0 auto 18px}
.bestellmenu-title{font-family:'DM Sans',sans-serif;font-size:1.05rem;font-weight:800;color:var(--text,#1a1a1a);padding:0 20px 14px;border-bottom:1.5px solid var(--border,#eee);margin-bottom:8px}
.bestellmenu-section{padding:6px 16px 2px;font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted,#888);text-transform:uppercase}
.bestellmenu-row{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:'DM Sans',sans-serif;transition:background .12s}
.bestellmenu-row:hover{background:rgba(45,80,22,.07)}
.bestellmenu-row:active{background:rgba(45,80,22,.13)}
.bestellmenu-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.bestellmenu-label{flex:1}
.bestellmenu-label strong{display:block;font-size:.9rem;font-weight:700;color:var(--text,#1a1a1a)}
.bestellmenu-label span{font-size:.75rem;color:var(--muted,#888)}
.bestellmenu-sep{height:1px;background:var(--border,#eee);margin:6px 20px}

/* KIEMLE MAPPING MODAL */
.kiemle-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 0 40px}
.kiemle-modal.hidden{display:none}
.kiemle-sheet{background:var(--card);border-radius:16px;padding:20px 16px 28px;width:100%;max-width:520px;margin:auto}
.kiemle-sheet h2{font-family:'DM Serif Display',serif;font-size:1.1rem;margin-bottom:4px;color:#5B3A8E}
.kiemle-sheet p{font-size:.8rem;color:var(--muted);margin-bottom:14px}
.kiemle-group{margin-bottom:12px;border:1px solid rgba(0,0,0,.08);border-radius:10px;overflow:hidden}
.kiemle-group-header{background:#5B3A8E;color:white;padding:7px 12px;font-size:.8rem;font-weight:700;letter-spacing:.04em}
.kiemle-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid rgba(0,0,0,.05)}
.kiemle-row:last-child{border-bottom:none}
.kiemle-row-name{font-size:.82rem;flex:1;color:var(--text)}
.kiemle-row select{flex:1;padding:4px 7px;border:1.5px solid var(--input-border);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.77rem;background:var(--input-bg);color:var(--text);outline:none;max-width:200px}
.kiemle-row select.mapped{border-color:#5B3A8E;background:#f3effe;color:#3a1f6e;font-weight:600}
.kiemle-footer{display:flex;gap:9px;margin-top:16px}
.btn-kiemle-save{flex:1;background:#5B3A8E;color:white;border:none;border-radius:10px;padding:11px;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer}
.btn-kiemle-cancel{background:transparent;color:var(--muted);border:1.5px solid #ddd;border-radius:10px;padding:11px 16px;font-family:'DM Sans',sans-serif;font-size:.86rem;cursor:pointer}

/* FILTER */
.filter-bar{background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:11px;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.filter-bar-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.filter-bar-row+.filter-bar-row{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.06)}
.filter-label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:42px}
.filter-bar input[type=date]{padding:7px 9px;border:1.5px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.82rem;background:white;outline:none;flex:1;min-width:120px}
.filter-bar input:focus{border-color:#2D5016}
.btn-load{background:#2D5016;color:white;border:none;border-radius:8px;padding:7px 13px;font-family:'DM Sans',sans-serif;font-size:.81rem;font-weight:600;cursor:pointer;flex-shrink:0}
.day-filter-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.day-chip{padding:5px 11px;border:1.5px solid #ddd;border-radius:20px;background:white;font-family:'DM Sans',sans-serif;font-size:.76rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.day-chip.active{background:#2D5016;border-color:#2D5016;color:white}
.day-chip.all-chip.active{background:var(--warn);border-color:var(--warn);color:white}

/* HISTORY */
.history-entry{background:var(--card);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.07);border:1px solid rgba(0,0,0,.06)}
.history-entry.deleted{display:none}
.history-entry-header{background:#2D5016;color:white;padding:10px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.history-entry-header.no-weekday{background:#555}
.hist-weekday{font-weight:700;font-size:1rem;letter-spacing:.01em}
.hist-created{font-size:.71rem;opacity:.7;margin-top:1px}
